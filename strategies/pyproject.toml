# =============================================================================
# HFT Python Strategy Engine - pyproject.toml
# =============================================================================
# Dependencies for Nautilus Trader, Ray distributed computing,
# and AMD GPU/NPU accelerated ML inference
# =============================================================================

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hft-strategies"
version = "0.1.0"
description = "HFT trading strategies with Nautilus Trader and Ray"
authors = [
    { name = "HFT Quant Team", email = "team@hft-quant.com" }
]
readme = "../../README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.12"
keywords = [
    "hft",
    "trading",
    "crypto",
    "nautilus-trader",
    "ray",
    "machine-learning",
    "quantitative-finance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    # ---------------------------------------------------------------------
    # NAUTILUS TRADER - Event-driven backtesting and live trading
    # ---------------------------------------------------------------------
    "nautilus_trader>=1.170.0",
    
    # ---------------------------------------------------------------------
    # RAY - Distributed computing framework
    # ---------------------------------------------------------------------
    "ray[default]>=2.7.0",
    "ray[tune]>=2.7.0",  # Hyperparameter tuning
    
    # ---------------------------------------------------------------------
    # DATA SCIENCE STACK
    # ---------------------------------------------------------------------
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    
    # ---------------------------------------------------------------------
    # MACHINE LEARNING - AMD GPU/NPU Accelerated
    # ---------------------------------------------------------------------
    # For AMD Radeon GPU (ROCm)
    "onnxruntime-rocm>=1.16.0; platform_system == 'Linux' and platform_machine == 'x86_64'",
    # Alternative: For AMD Ryzen AI NPU (VitisAI)
    # "onnxruntime-vitisai>=1.16.0",
    # Fallback: Standard onnxruntime (CPU only)
    "onnxruntime>=1.16.0",
    
    # Scikit-learn for traditional ML
    "scikit-learn>=1.3.0",
    
    # Hidden Markov Models for regime detection
    "hmmlearn>=0.3.0",
    
    # ---------------------------------------------------------------------
    # STATISTICAL MODELING
    # ---------------------------------------------------------------------
    # GARCH volatility modeling
    "arch>=6.0.0",
    
    # Time series analysis
    "statsmodels>=0.14.0",
    
    # ---------------------------------------------------------------------
    # VALIDATION & SETTINGS
    # ---------------------------------------------------------------------
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    
    # ---------------------------------------------------------------------
    # UTILITIES
    # ---------------------------------------------------------------------
    "redis>=5.0.0",  # Redis pub/sub client
    "asyncpg>=0.29.0",  # QuestDB/PostgreSQL async client
    "aiohttp>=3.9.0",  # Async HTTP client
    "python-dotenv>=1.0.0",  # Environment variable management
    "rich>=13.0.0",  # Beautiful terminal output
    "typer>=0.9.0",  # CLI framework
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.5.0",
]

backtest = [
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
]

gpu = [
    # PyTorch with ROCm support for AMD GPUs
    "torch>=2.1.0",
    # Note: Install ROCm version separately:
    # pip3 install torch --index-url https://download.pytorch.org/whl/rocm5.6
]

[project.urls]
Homepage = "https://github.com/yourusername/hft-quant-trading"
Documentation = "https://github.com/yourusername/hft-quant-trading/wiki"
Repository = "https://github.com/yourusername/hft-quant-trading.git"
Issues = "https://github.com/yourusername/hft-quant-trading/issues"

[project.scripts]
hft-strategy = "hft_strategies.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hft_strategies*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "nautilus_trader.*",
    "hmmlearn.*",
    "arch.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=hft_strategies --cov-report=term-missing"
