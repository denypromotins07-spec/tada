# =============================================================================
# Redis Configuration
# =============================================================================
# Optimized for sub-millisecond pub/sub state synchronization
# Designed for 1GB RAM allocation with volatile-lru eviction
# No persistence - purely in-memory for maximum speed
# =============================================================================

# -----------------------------------------------------------------------------
# NETWORK SETTINGS
# -----------------------------------------------------------------------------
bind 0.0.0.0
port 6379
protected-mode no
timeout 0
tcp-keepalive 300

# -----------------------------------------------------------------------------
# MEMORY MANAGEMENT (Critical for 1GB limit)
# -----------------------------------------------------------------------------
# Maximum memory: 1GB
maxmemory 1gb

# Eviction policy: Remove keys with TTL when memory is full
# This ensures we never OOM and always keep recent data
maxmemory-policy volatile-lru

# Memory samples for LRU approximation
maxmemory-samples 10

# -----------------------------------------------------------------------------
# PERSISTENCE - DISABLED FOR MAXIMUM SPEED
# -----------------------------------------------------------------------------
# No RDB snapshots (would cause latency spikes)
save ""

# No AOF logging (would cause latency and use disk I/O)
appendonly no

# -----------------------------------------------------------------------------
# LAZY FREEING (Prevents latency spikes from large deletions)
# -----------------------------------------------------------------------------
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# -----------------------------------------------------------------------------
# CLIENT SETTINGS
# -----------------------------------------------------------------------------
# Maximum number of clients
maxclients 10000

# Client output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 256mb 64mb 60

# -----------------------------------------------------------------------------
# SLOW LOG (For debugging latency issues)
# -----------------------------------------------------------------------------
slowlog-log-slower-than 10000
slowlog-max-len 128

# -----------------------------------------------------------------------------
# LATENCY MONITOR
# -----------------------------------------------------------------------------
latency-monitor-threshold 100

# -----------------------------------------------------------------------------
# ADVANCED SETTINGS
# -----------------------------------------------------------------------------
# Hash data structure optimization
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# List data structure optimization  
list-max-ziplist-size -2
list-compress-depth 0

# Set data structure optimization
set-max-intset-entries 512

# Sorted set optimization
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# HyperLogLog sparse representation bytes limit
hll-sparse-max-bytes 3000

# Active rehashing
activerehashing yes

# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------
loglevel notice
logfile ""

# -----------------------------------------------------------------------------
# SECURITY (Set password via environment variable in production)
# -----------------------------------------------------------------------------
# requirepass ${REDIS_PASSWORD}

# -----------------------------------------------------------------------------
# CLUSTER MODE (Disabled for single-instance setup)
# -----------------------------------------------------------------------------
cluster-enabled no
