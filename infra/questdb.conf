# =============================================================================
# QuestDB Configuration
# =============================================================================
# Optimized for HFT tick data storage with strict memory limits
# Designed for 4GB RAM allocation in Docker container
# =============================================================================

# -----------------------------------------------------------------------------
# DATABASE IDENTIFIER
# -----------------------------------------------------------------------------
cairo.sql.copy.pool.capacity=64
cairo.sql.page.frame.capacity=64M
cairo.sql.writer.cmd.queue.capacity=2048
cairo.sql.writer.command.concurrency=16

# -----------------------------------------------------------------------------
# MEMORY SETTINGS (Critical for 4GB limit)
# -----------------------------------------------------------------------------
# Max memory map count
os.info.available.memory.retry.timeout=1000

# Column version queue size
cairo.column.version.queue.size=4096

# Max swap file size
cairo.max.swap.file.size=256M

# -----------------------------------------------------------------------------
# WAL (Write-Ahead Log) CONFIGURATION
# -----------------------------------------------------------------------------
cairo.wal.enabled=true
cairo.wal.queue.capacity=4096
cairo.wal.event.queue.capacity=4096

# -----------------------------------------------------------------------------
# TABLE CONFIGURATION
# -----------------------------------------------------------------------------
cairo.root=/var/lib/questdb/db
cairo.snapshot.instance.root=/var/lib/questdb/snapshots

# Default table configuration
cairo.default.table.id=0

# -----------------------------------------------------------------------------
# INFLUXDB LINE PROTOCOL (ILP) SETTINGS
# -----------------------------------------------------------------------------
# For high-throughput tick ingestion
line.tcp.msg.chunk.size=2048
line.tcp.encoding.utf8=true
line.tcp.timestamp.adapter.class=io.questdb.cairo.DefaultTimestampAdapter

# ILP authentication (optional, enable in production)
# line.tcp.auth.db.path=/var/lib/questdb/authdb.txt

# -----------------------------------------------------------------------------
# NETWORK SETTINGS
# -----------------------------------------------------------------------------
# PostgreSQL wire protocol port
pg.worker.count=4

# HTTP API settings
http.keep.alive.timeout=30000
http.io.queue.capacity=4096

# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------
log.level=INFO
log.dirs=/var/lib/questdb/log
log.buffer.size=4096

# -----------------------------------------------------------------------------
# MISC OPTIMIZATIONS
# -----------------------------------------------------------------------------
cairo.spin.lock.timeout.us=1000000
cairo.commit.lag=5000000
cairo.o3.max.lag=5000000

# Enable parallel indexing
cairo.index.parallelism=4

# Query timeout
cairo.query.timeout=60000
