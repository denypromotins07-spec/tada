version: '3.8'

# QuantumHFT - Container Orchestration
# Optimized for 16GB RAM with strict resource limits

services:
  # ===========================================
  # TimescaleDB - Time-Series Database
  # ===========================================
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: quantumhft-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: quantumhft
      POSTGRES_PASSWORD: ${TIMESCALEDB_PASSWORD:-quantumhft_secure}
      POSTGRES_DB: quantumhft_timeseries
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantumhft -d quantumhft_timeseries"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'
    networks:
      - quantumhft-network

  # ===========================================
  # Redis - Agent State Cache & Pub/Sub
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: quantumhft-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    networks:
      - quantumhft-network

  # ===========================================
  # Redpanda - Kafka-Compatible Streaming
  # Low-memory alternative to Kafka
  # ===========================================
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.13
    container_name: quantumhft-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - '0'
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --pandaproxy-addr
      - PLAINTEXT://0.0.0.0:28082,OUTSIDE://0.0.0.0:8082
      - --advertise-pandaproxy-addr
      - PLAINTEXT://redpanda:28082,OUTSIDE://localhost:8082
    ports:
      - "9092:9092"
      - "8082:8082"
      - "28082:28082"
      - "29092:29092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9644/v1/status/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    networks:
      - quantumhft-network

  # ===========================================
  # Grafana - Metrics Visualization (Optional)
  # ===========================================
  grafana:
    image: grafana/grafana:10.2.2
    container_name: quantumhft-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - timescaledb
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    networks:
      - quantumhft-network
    profiles:
      - monitoring

# ===========================================
# Volumes
# ===========================================
volumes:
  timescaledb_data:
    driver: local
  redis_data:
    driver: local
  redpanda_data:
    driver: local
  grafana_data:
    driver: local

# ===========================================
# Networks
# ===========================================
networks:
  quantumhft-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
